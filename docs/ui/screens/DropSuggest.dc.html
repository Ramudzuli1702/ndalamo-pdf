<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Suggested tools after a drop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2448C9}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F5F7; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E2E4E9">
    <svg role="img" aria-label="Ndalamo" width="28" height="28" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6H16a5 5 0 0 0-5 5v42a5 5 0 0 0 5 5h32a5 5 0 0 0 5-5V21z" stroke="#16181D" stroke-width="5"></path><path d="M38 6v15h15" stroke="#16181D" stroke-width="5"></path><path d="M22 48v-5M31 48v-10M40 48v-14" stroke="#1E8A4C" stroke-width="6"></path><path d="M40 34c0-6 3-9 9-9 0 6-3 9-9 9z" fill="#1E8A4C"></path></svg>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #16181D; font-size: 14px; border: 1px solid #D5D8DF">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Home
    </a>
    <span style="font-size: 16px; font-weight: 600">What do you want to do?</span>
  </header>

  <main style="width: 100%; max-width: 880px; margin: 0 auto; padding: 32px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: center; padding: 18px; background: #FFFFFF; border: 1px solid #E2E4E9; border-radius: 12px">
      <div style="width: 64px; aspect-ratio: 210 / 297; background: #FFFFFF; border: 1px solid #D5D8DF; border-radius: 4px; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px">
        <span style="display: block; height: 5px; width: 70%; background: #B9BEC9"></span>
        <span style="display: block; height: 3px; width: 100%; background: #D5D8DF"></span>
        <span style="display: block; height: 3px; width: 90%; background: #D5D8DF"></span>
        <span style="display: block; height: 3px; width: 95%; background: #D5D8DF"></span>
      </div>
      <div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 17px; font-weight: 600">Scan_0031.pdf</span>
        <span style="font-size: 13px; color: #5B616E">8 pages · 14.6 MB · scanned pages, no selectable text</span>
      </div>
      <button style="height: 40px; padding: 0 14px; border: 1px solid #D5D8DF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #16181D">Add more files</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Suggested for this file</h2>
      <button style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px; border: 2px solid {{accent}}; border-radius: 10px; background: #FFFFFF; font: inherit; color: #16181D; text-align: left">
        <span style="display: flex; flex-direction: column; gap: 2px; flex: 1 1 300px">
          <span style="font-size: 15px; font-weight: 600">Make searchable (OCR)</span>
          <span style="font-size: 13px; color: #5B616E">This looks like a scan. OCR lets you search, copy and convert the text.</span>
        </span>
        <span style="font-size: 12px; font-weight: 600; color: #FFFFFF; background: {{accent}}; padding: 4px 10px; border-radius: 999px">Recommended</span>
      </button>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px">
        <sc-for list="{{suggestions}}" as="s" hint-placeholder-count="4">
          <button style="display: flex; flex-direction: column; gap: 2px; padding: 14px; border: 1px solid #E2E4E9; border-radius: 10px; background: #FFFFFF; font: inherit; color: #16181D; text-align: left">
            <span style="font-size: 14px; font-weight: 600">{{s.name}}</span>
            <span style="font-size: 12px; color: #5B616E">{{s.why}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <a href="Main.dc.html" style="font-size: 14px">See all tools</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#C2410C","#0F766E","#16181D"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2F5BEA',
      suggestions: [
        { name: 'Compress PDF', why: '14.6 MB is large for email or upload portals' },
        { name: 'PDF to Word (OCR)', why: 'Get editable text from the scan' },
        { name: 'Page workspace', why: 'Rotate or remove crooked pages' },
        { name: 'Run a pipeline', why: 'e.g. “Client documents”: OCR → compress → protect' }
      ]
    };
  }
}
</script>
</body>
</html>
