<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipeline builder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2448C9}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F5F7; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E2E4E9">
    <svg role="img" aria-label="Ndalamo" width="28" height="28" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6H16a5 5 0 0 0-5 5v42a5 5 0 0 0 5 5h32a5 5 0 0 0 5-5V21z" stroke="#16181D" stroke-width="5"></path><path d="M38 6v15h15" stroke="#16181D" stroke-width="5"></path><path d="M22 48v-5M31 48v-10M40 48v-14" stroke="#1E8A4C" stroke-width="6"></path><path d="M40 34c0-6 3-9 9-9 0 6-3 9-9 9z" fill="#1E8A4C"></path></svg>
    <a href="Pipelines.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #16181D; font-size: 14px; border: 1px solid #D5D8DF">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Pipelines
    </a>
    <label for="pname" style="position: absolute; left: -9999px">Pipeline name</label>
    <input id="pname" value="Client documents" style="height: 40px; padding: 0 12px; border: 1px solid #D5D8DF; border-radius: 8px; font: inherit; font-size: 16px; font-weight: 600; color: #16181D; min-width: 0; flex: 0 1 280px">
    <div style="margin-left: auto; display: flex; gap: 8px">
      <button style="height: 40px; padding: 0 14px; border: 1px solid #D5D8DF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #16181D">Test on a file</button>
      <a href="Pipelines.dc.html" style="height: 40px; padding: 0 18px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Save pipeline</a>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <main style="flex: 999 1 560px; min-width: 0; padding: 28px; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #5B616E">Input: any PDF or image · steps run top to bottom</span>

      <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #FFFFFF; border: {{s.border}}; border-radius: 10px">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="2" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
            <span style="width: 28px; height: 28px; border-radius: 999px; background: #E8EDFB; color: #2448C9; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{s.n}}</span>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 15px; font-weight: 600">{{s.tool}}</span>
              <span style="font-size: 13px; color: #5B616E">{{s.opts}}</span>
            </div>
            <button style="height: 36px; padding: 0 12px; border: 1px solid #D5D8DF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16181D">Options</button>
            <button aria-label="Remove step {{s.n}}" style="width: 36px; height: 36px; border: 0; border-radius: 6px; background: transparent; display: flex; align-items: center; justify-content: center">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B616E" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
            </button>
          </div>
          <sc-if value="{{s.warn}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 8px; background: #FFF4E5; color: #7A3E00; font-size: 13px">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
              <span>{{s.warn}}</span>
              <button style="margin-left: auto; border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: #7A3E00; text-decoration: underline">Move to end</button>
            </div>
          </sc-if>
        </div>
      </sc-for>

      <button style="height: 48px; border: 2px dashed #A9B4D6; border-radius: 10px; background: transparent; font: inherit; font-size: 14px; font-weight: 600; color: #2448C9">+ Add step</button>

      <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; background: #FFFFFF; border: 1px solid #E2E4E9; border-radius: 10px; margin-top: 8px">
        <span style="font-size: 13px; font-weight: 600">Output</span>
        <span style="font-size: 13px; color: #5B616E">Same folder as the original · <span style="font-family: ui-monospace, monospace">{name}_client.pdf</span></span>
      </div>
    </main>

    <aside style="flex: 1 1 260px; max-width: 300px; padding: 24px 20px; background: #FFFFFF; border-left: 1px solid #E2E4E9; display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 600">Add a step</h2>
      <label for="stepsearch" style="position: absolute; left: -9999px">Search tools</label>
      <input id="stepsearch" placeholder="Search tools" style="height: 40px; padding: 0 12px; border: 1px solid #D5D8DF; border-radius: 8px; font: inherit; font-size: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{palette}}" as="t" hint-placeholder-count="8">
          <button style="height: 40px; padding: 0 12px; border: 1px solid #E2E4E9; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #16181D; text-align: left">{{t}}</button>
        </sc-for>
      </div>
      <div style="margin-top: auto; padding-top: 14px; border-top: 1px solid #E2E4E9; display: flex; flex-direction: column; gap: 8px; font-size: 14px">
        <label style="display: flex; gap: 8px"><input type="checkbox" checked> Pin to home screen</label>
        <a href="WatchFolders.dc.html" style="font-size: 14px">Link to a watch folder</a>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#C2410C","#0F766E","#16181D"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2F5BEA',
      steps: [
        { n: 1, tool: 'OCR PDF', opts: 'English · skip pages that already have text', border: '1px solid #E2E4E9', warn: '' },
        { n: 2, tool: 'Protect PDF', opts: 'Ask for password on each run', border: '1px solid #F2B872', warn: 'Later steps can’t change a password-protected PDF. Protect should be the last step.' },
        { n: 3, tool: 'Compress PDF', opts: 'Recommended', border: '1px solid #E2E4E9', warn: '' },
        { n: 4, tool: 'Watermark', opts: '“CONFIDENTIAL” · diagonal · 20% opacity', border: '1px solid #E2E4E9', warn: '' }
      ],
      palette: ['Merge PDF', 'Split PDF', 'Rotate pages', 'Page numbers', 'Compress to size', 'PDF to Word', 'PDF to Excel', 'Redact PDF']
    };
  }
}
</script>
</body>
</html>
