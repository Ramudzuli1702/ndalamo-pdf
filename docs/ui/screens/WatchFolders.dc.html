<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Watch folders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2448C9}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F5F7; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E2E4E9">
    <svg role="img" aria-label="Ndalamo" width="28" height="28" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6H16a5 5 0 0 0-5 5v42a5 5 0 0 0 5 5h32a5 5 0 0 0 5-5V21z" stroke="#16181D" stroke-width="5"></path><path d="M38 6v15h15" stroke="#16181D" stroke-width="5"></path><path d="M22 48v-5M31 48v-10M40 48v-14" stroke="#1E8A4C" stroke-width="6"></path><path d="M40 34c0-6 3-9 9-9 0 6-3 9-9 9z" fill="#1E8A4C"></path></svg>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #16181D; font-size: 14px; border: 1px solid #D5D8DF">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Home
    </a>
    <nav aria-label="Automation" style="display: flex; gap: 4px">
      <a href="Pipelines.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; color: #3A3F4A; font-size: 14px; text-decoration: none">Pipelines</a>
      <a href="WatchFolders.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; background: #E8EDFB; color: #16181D; font-size: 14px; font-weight: 600; text-decoration: none">Watch folders</a>
    </nav>
    <button style="margin-left: auto; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">+ Add watch folder</button>
  </header>

  <main style="width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Watch folders</h1>
      <span style="font-size: 14px; color: #5B616E">Files dropped into a watched folder run through its pipeline automatically while the app is open or in the system tray.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{folders}}" as="w" hint-placeholder-count="2">
        <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 16px 18px; background: #FFFFFF; border: 1px solid #E2E4E9; border-radius: 12px">
          <div style="flex: 1 1 520px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; min-width: 0">
            <span style="font-size: 13px; font-family: ui-monospace, monospace; padding: 6px 10px; background: #F4F5F7; border-radius: 6px">{{w.input}}</span>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <span style="font-size: 14px; font-weight: 600">{{w.pipeline}}</span>
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
            <span style="font-size: 13px; font-family: ui-monospace, monospace; padding: 6px 10px; background: #F4F5F7; border-radius: 6px">{{w.output}}</span>
          </div>
          <span style="font-size: 13px; color: {{w.statusColor}}; font-weight: 500">{{w.status}}</span>
          <button style="height: 36px; padding: 0 12px; border: 1px solid #D5D8DF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16181D">{{w.toggle}}</button>
        </div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; gap: 10px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">Activity</h2>
        <button style="margin-left: auto; height: 32px; padding: 0 10px; border: 1px solid #D5D8DF; border-radius: 6px; background: #FFFFFF; font: inherit; font-size: 13px; color: #16181D">Export log</button>
      </div>
      <div style="background: #FFFFFF; border: 1px solid #E2E4E9; border-radius: 10px; overflow-x: auto">
        <sc-for list="{{log}}" as="l" hint-placeholder-count="5">
          <div style="display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 11px 16px; border-bottom: 1px solid #EEF0F4; font-size: 13px">
            <span style="width: 64px; color: #5B616E; font-variant-numeric: tabular-nums">{{l.time}}</span>
            <span style="flex: 1 1 260px; font-weight: 500">{{l.file}}</span>
            <span style="color: #5B616E">{{l.pipeline}}</span>
            <span style="color: {{l.color}}; font-weight: 500; min-width: 140px">{{l.result}}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#C2410C","#0F766E","#16181D"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2F5BEA',
      folders: [
        { input: '\\\\OFFICE-PC\\Scans\\Incoming', pipeline: 'Client documents', output: '\\\\OFFICE-PC\\Scans\\Ready', status: 'Watching · 63 processed', statusColor: '#1E6B3A', toggle: 'Pause' },
        { input: 'D:\\Invoices\\New', pipeline: 'Invoice to spreadsheet', output: 'D:\\Invoices\\Excel', status: 'Paused', statusColor: '#5B616E', toggle: 'Resume' }
      ],
      log: [
        { time: '10:42', file: 'Scan_0034.pdf', pipeline: 'Client documents', result: 'Done · 6.2 → 1.1 MB', color: '#1E6B3A' },
        { time: '10:41', file: 'Scan_0033.pdf', pipeline: 'Client documents', result: 'Done · 3.9 → 0.8 MB', color: '#1E6B3A' },
        { time: '10:15', file: 'ID_copy_Mokoena.pdf', pipeline: 'Client documents', result: 'Failed · file is locked', color: '#B42318' },
        { time: '09:58', file: 'Scan_0032.pdf', pipeline: 'Client documents', result: 'Done · 5.0 → 1.0 MB', color: '#1E6B3A' },
        { time: '09:30', file: 'Scan_0031.pdf', pipeline: 'Client documents', result: 'Done · 14.6 → 2.2 MB', color: '#1E6B3A' }
      ]
    };
  }
}
</script>
</body>
</html>
