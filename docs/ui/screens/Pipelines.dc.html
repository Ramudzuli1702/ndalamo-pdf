<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pipelines</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2448C9}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F5F7; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E2E4E9">
    <svg role="img" aria-label="Ndalamo" width="28" height="28" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6H16a5 5 0 0 0-5 5v42a5 5 0 0 0 5 5h32a5 5 0 0 0 5-5V21z" stroke="#16181D" stroke-width="5"></path><path d="M38 6v15h15" stroke="#16181D" stroke-width="5"></path><path d="M22 48v-5M31 48v-10M40 48v-14" stroke="#1E8A4C" stroke-width="6"></path><path d="M40 34c0-6 3-9 9-9 0 6-3 9-9 9z" fill="#1E8A4C"></path></svg>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #16181D; font-size: 14px; border: 1px solid #D5D8DF">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Home
    </a>
    <nav aria-label="Automation" style="display: flex; gap: 4px">
      <a href="Pipelines.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; background: #E8EDFB; color: #16181D; font-size: 14px; font-weight: 600; text-decoration: none">Pipelines</a>
      <a href="WatchFolders.dc.html" style="height: 40px; padding: 0 14px; display: flex; align-items: center; border-radius: 8px; color: #3A3F4A; font-size: 14px; text-decoration: none">Watch folders</a>
    </nav>
    <a href="PipelineBuilder.dc.html" style="margin-left: auto; height: 40px; padding: 0 16px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none; display: flex; align-items: center">+ New pipeline</a>
  </header>

  <main style="width: 100%; max-width: 1080px; margin: 0 auto; padding: 28px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 600">Pipelines</h1>
      <span style="font-size: 14px; color: #5B616E">Saved chains of tools. Pinned pipelines appear on the home screen.</span>
    </div>

    <sc-for list="{{pipelines}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 18px; background: #FFFFFF; border: 1px solid #E2E4E9; border-radius: 12px">
        <div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
            <span style="font-size: 16px; font-weight: 600">{{p.name}}</span>
            <sc-if value="{{p.pinned}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #E8EDFB; color: #2448C9; font-weight: 500">Pinned</span>
            </sc-if>
            <sc-if value="{{p.watched}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #E6F4EC; color: #1E6B3A; font-weight: 500">Watching a folder</span>
            </sc-if>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
            <sc-for list="{{p.steps}}" as="s" hint-placeholder-count="3">
              <span style="display: flex; align-items: center; gap: 6px">
                <span style="font-size: 13px; padding: 5px 10px; border-radius: 6px; background: #F4F5F7; border: 1px solid #E2E4E9">{{s.label}}</span>
                <sc-if value="{{s.more}}" hint-placeholder-val="{{true}}">
                  <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
                </sc-if>
              </span>
            </sc-for>
          </div>
          <span style="font-size: 12px; color: #5B616E">{{p.used}}</span>
        </div>
        <div style="display: flex; gap: 8px">
          <a href="PipelineBuilder.dc.html" style="height: 40px; padding: 0 14px; border: 1px solid #D5D8DF; border-radius: 8px; color: #16181D; font-size: 14px; text-decoration: none; display: flex; align-items: center">Edit</a>
          <button style="height: 40px; padding: 0 14px; border: 1px solid #D5D8DF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #16181D">Duplicate</button>
          <button style="height: 40px; padding: 0 18px; border: 0; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">Run</button>
        </div>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#C2410C","#0F766E","#16181D"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const steps = (arr) => arr.map((l, i) => ({ label: l, more: i < arr.length - 1 }));
    return {
      accent: this.props.accent ?? '#2F5BEA',
      pipelines: [
        { name: 'Submit assignment', pinned: true, watched: false, steps: steps(['Merge', 'Page numbers', 'Compress to 2 MB']), used: 'Last run yesterday · 14 runs' },
        { name: 'Client documents', pinned: true, watched: true, steps: steps(['OCR', 'Compress', 'Protect with password']), used: 'Last run 2 hours ago · 63 runs' },
        { name: 'Invoice to spreadsheet', pinned: false, watched: false, steps: steps(['OCR', 'PDF to Excel']), used: 'Last run 5 days ago · 8 runs' }
      ]
    };
  }
}
</script>
</body>
</html>
