<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2448C9}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F5F7; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 16px; padding: 14px 24px; background: #FFFFFF; border-bottom: 1px solid #E2E4E9">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 8px; background: {{accent}}; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 64 64" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6H16a5 5 0 0 0-5 5v42a5 5 0 0 0 5 5h32a5 5 0 0 0 5-5V21z" stroke-width="5"></path><path d="M38 6v15h15" stroke-width="5"></path><path d="M22 48v-5M31 48v-10M40 48v-14" stroke-width="6"></path><path d="M40 34c0-6 3-9 9-9 0 6-3 9-9 9z" fill="#FFFFFF" stroke="none"></path></svg>
      </div>
      <span style="font-weight: 700; font-size: 17px">Ndalamo</span>
    </div>
    <div style="flex: 1 1 320px; display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 40px; border: 1px solid #D5D8DF; border-radius: 8px; background: #F9FAFB; max-width: 560px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B616E" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <label for="toolsearch" style="position: absolute; left: -9999px">Search tools</label>
      <input id="toolsearch" placeholder="Search tools — try “compress” or “to Word”" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 14px; color: #16181D; outline: none; min-width: 0">
      <span style="font-size: 12px; color: #5B616E; border: 1px solid #D5D8DF; border-radius: 4px; padding: 1px 6px">Ctrl K</span>
    </div>
    <div style="display: flex; gap: 8px; margin-left: auto">
      <a href="Pipelines.dc.html" style="height: 40px; padding: 0 14px; border: 1px solid #D5D8DF; border-radius: 8px; background: #FFFFFF; font-size: 14px; color: #16181D; text-decoration: none; display: flex; align-items: center">Pipelines</a>
      <a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 40px; box-sizing: border-box; border: 1px solid #D5D8DF; border-radius: 8px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
      </a>
    </div>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <aside style="flex: 1 1 220px; max-width: 260px; padding: 24px 20px; background: #FFFFFF; border-right: 1px solid #E2E4E9; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B616E">Recent files</h2>
        <sc-for list="{{recentFiles}}" as="f" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border-radius: 6px; background: #F4F5F7">
            <span style="font-size: 14px; font-weight: 500">{{f.name}}</span>
            <span style="font-size: 12px; color: #5B616E">{{f.meta}}</span>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h2 style="margin: 0; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #5B616E">Recent tools</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 6px">
          <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid #D5D8DF">Compress</span>
          <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid #D5D8DF">Merge</span>
          <span style="font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid #D5D8DF">PDF to Word</span>
        </div>
      </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #1E6B3A">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E6B3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        <span>Offline · files never leave this PC</span>
      </div>
    </aside>

    <main style="flex: 999 1 560px; min-width: 0; padding: 28px 32px; display: flex; flex-direction: column; gap: 28px">
      <div style="border: 2px dashed #A9B4D6; border-radius: 12px; background: #FFFFFF; padding: 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px">
        <div style="width: 52px; height: 52px; border-radius: 12px; background: #E8EDFB; display: flex; align-items: center; justify-content: center">
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"></path><path d="M7 9l5-5 5 5"></path><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path></svg>
        </div>
        <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 18px; font-weight: 600">Drop files anywhere to start</span>
          <span style="font-size: 14px; color: #5B616E">PDF, Word, Excel, PowerPoint or images — we’ll suggest the right tools.</span>
        </div>
        <a href="DropSuggest.dc.html" style="height: 44px; padding: 0 20px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Choose files</a>
      </div>

      <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
        <section style="display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-size: 15px; font-weight: 600">{{g.title}}</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px">
            <sc-for list="{{g.tools}}" as="t" hint-placeholder-count="4">
              <button style="text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid #E2E4E9; border-radius: 10px; background: #FFFFFF; font: inherit; color: #16181D; min-height: 72px">
                <span style="flex: none; width: 34px; height: 34px; border-radius: 8px; background: {{g.tint}}; display: flex; align-items: center; justify-content: center">
                  <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{g.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path></svg>
                </span>
                <span style="display: flex; flex-direction: column; gap: 2px">
                  <span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
                  <span style="font-size: 12px; color: #5B616E">{{t.desc}}</span>
                </span>
              </button>
            </sc-for>
          </div>
        </section>
      </sc-for>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#C2410C","#0F766E","#16181D"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2F5BEA',
      recentFiles: [
        { name: 'INF3B_Assignment2.pdf', meta: 'Compressed · 1.8 MB' },
        { name: 'Invoice_Oct.pdf', meta: 'Converted to Excel' },
        { name: 'Lecture_notes_wk9.pdf', meta: 'Merged · 42 pages' },
        { name: 'Scan_0031.pdf', meta: 'OCR · searchable' }
      ],
      groups: [
        { title: 'Organize', tint: '#E8EDFB', ink: '#2448C9', tools: [
          { name: 'Merge PDF', desc: 'Combine files in any order' },
          { name: 'Split PDF', desc: 'By range, every page or size' },
          { name: 'Page workspace', desc: 'Reorder, rotate, remove, crop' }
        ]},
        { title: 'Optimize', tint: '#E6F4EC', ink: '#1E6B3A', tools: [
          { name: 'Compress PDF', desc: 'Smaller files, same pages' },
          { name: 'Compress to size', desc: 'e.g. under 2 MB for uploads' },
          { name: 'Repair PDF', desc: 'Fix damaged files' },
          { name: 'PDF to PDF/A', desc: 'Long-term archiving' }
        ]},
        { title: 'Convert', tint: '#FDEEE3', ink: '#B4440C', tools: [
          { name: 'PDF to Word', desc: 'Editable .docx' },
          { name: 'PDF to Excel', desc: 'Tables to .xlsx' },
          { name: 'Office to PDF', desc: 'Word, Excel, PowerPoint' },
          { name: 'Image to PDF', desc: 'JPG, PNG, scans' },
          { name: 'PDF to JPG', desc: 'Pages as images' },
          { name: 'OCR PDF', desc: 'Make scans searchable' }
        ]},
        { title: 'Edit & sign', tint: '#F1ECFB', ink: '#5B35B5', tools: [
          { name: 'Page numbers', desc: 'Position, style, start number' },
          { name: 'Watermark', desc: 'Text or image' },
          { name: 'Sign PDF', desc: 'Draw, type or upload' },
          { name: 'Redact PDF', desc: 'Black out sensitive info' },
          { name: 'Fill forms', desc: 'Complete PDF forms' }
        ]},
        { title: 'Security & compare', tint: '#ECEEF2', ink: '#2E333D', tools: [
          { name: 'Protect PDF', desc: 'Add a password' },
          { name: 'Unlock PDF', desc: 'Remove a known password' },
          { name: 'Compare PDF', desc: 'Spot differences' }
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
