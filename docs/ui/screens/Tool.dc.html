<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compress PDF tool</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2448C9}a:hover{color:#1A3596}
</style>
</helmet>
<div style="min-height: 900px; background: #F4F5F7; color: #16181D; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 20px; background: #FFFFFF; border-bottom: 1px solid #E2E4E9">
    <svg role="img" aria-label="Ndalamo" width="28" height="28" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M38 6H16a5 5 0 0 0-5 5v42a5 5 0 0 0 5 5h32a5 5 0 0 0 5-5V21z" stroke="#16181D" stroke-width="5"></path><path d="M38 6v15h15" stroke="#16181D" stroke-width="5"></path><path d="M22 48v-5M31 48v-10M40 48v-14" stroke="#1E8A4C" stroke-width="6"></path><path d="M40 34c0-6 3-9 9-9 0 6-3 9-9 9z" fill="#1E8A4C"></path></svg>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 8px; text-decoration: none; color: #16181D; font-size: 14px; border: 1px solid #D5D8DF">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      Home
    </a>
    <span style="font-size: 16px; font-weight: 600">Compress PDF</span>
    <span style="font-size: 13px; color: #5B616E">Step 1 of 2 · Files and options</span>
  </header>

  <div style="display: flex; flex-wrap: wrap; flex: 1">
    <main style="flex: 999 1 560px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
        <h2 style="margin: 0; font-size: 15px; font-weight: 600">3 files · 11.2 MB total</h2>
        <span style="font-size: 13px; color: #5B616E">Drag to reorder</span>
        <button style="margin-left: auto; height: 40px; padding: 0 14px; border: 1px solid #D5D8DF; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 14px; color: #16181D">+ Add files</button>
      </div>
      <sc-for list="{{files}}" as="f" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E2E4E9; border-radius: 10px">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A909C" stroke-width="2" stroke-linecap="round"><path d="M8 6h.01M8 12h.01M8 18h.01M16 6h.01M16 12h.01M16 18h.01"></path></svg>
          <div style="width: 36px; aspect-ratio: 210 / 297; border: 1px solid #D5D8DF; border-radius: 3px; background: #FFFFFF"></div>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-size: 14px; font-weight: 500">{{f.name}}</span>
            <span style="font-size: 12px; color: #5B616E">{{f.meta}}</span>
          </div>
          <button aria-label="Remove {{f.name}}" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B616E" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
      </sc-for>
    </main>

    <aside style="flex: 1 1 320px; max-width: 380px; padding: 24px 22px; background: #FFFFFF; border-left: 1px solid #E2E4E9; display: flex; flex-direction: column; gap: 22px">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
        <legend style="font-size: 15px; font-weight: 600; margin-bottom: 8px">Compression</legend>
        <label style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid #E2E4E9; border-radius: 8px; font-size: 14px">
          <input type="radio" name="mode" style="margin-top: 3px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Recommended</span><span style="font-size: 12px; color: #5B616E">Good quality, good size</span></span>
        </label>
        <label style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid #E2E4E9; border-radius: 8px; font-size: 14px">
          <input type="radio" name="mode" style="margin-top: 3px">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Strong</span><span style="font-size: 12px; color: #5B616E">Smallest file, lower image quality</span></span>
        </label>
        <label style="display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 2px solid {{accent}}; border-radius: 8px; font-size: 14px; background: #F5F7FE">
          <input type="radio" name="mode" checked style="margin-top: 3px">
          <span style="display: flex; flex-direction: column; gap: 8px; flex: 1"><span style="font-weight: 500">Target size</span>
            <span style="display: flex; align-items: center; gap: 8px"><input aria-label="Target size in MB" value="2" style="width: 64px; height: 36px; padding: 0 10px; border: 1px solid #D5D8DF; border-radius: 6px; font: inherit; font-size: 14px"><span style="font-size: 13px">MB per file</span></span>
            <span style="font-size: 12px; color: #5B616E">For upload portals with a size limit</span>
          </span>
        </label>
      </fieldset>

      <details style="font-size: 14px">
        <summary style="cursor: pointer; font-weight: 500">Advanced options</summary>
        <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 10px; color: #3A3F4A">
          <label style="display: flex; gap: 8px"><input type="checkbox" checked> Downscale images above 150 dpi</label>
          <label style="display: flex; gap: 8px"><input type="checkbox"> Convert to greyscale</label>
          <label style="display: flex; gap: 8px"><input type="checkbox"> Remove metadata</label>
        </div>
      </details>

      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 18px; border-top: 1px solid #E2E4E9">
        <span style="font-size: 13px; font-weight: 600">Save to</span>
        <span style="font-size: 13px; color: #5B616E">Same folder as each original · <span style="font-family: ui-monospace, monospace">{name}_compressed.pdf</span></span>
        <a href="Settings.dc.html" style="font-size: 13px">Change</a>
      </div>

      <a href="Progress.dc.html" style="margin-top: auto; height: 48px; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Compress 3 files</a>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5BEA","options":["#2F5BEA","#C2410C","#0F766E","#16181D"]},"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#2F5BEA',
      files: [
        { name: 'INF3B_Assignment2.pdf', meta: '14 pages · 4.1 MB' },
        { name: 'Lecture_slides_wk9.pdf', meta: '38 pages · 5.6 MB' },
        { name: 'Certificate_scan.pdf', meta: '1 page · 1.5 MB' }
      ]
    };
  }
}
</script>
</body>
</html>
