# A second, hidden program in Ndalamo's folder for the installer: it runs
# "NdalamoHelper.exe --install-word-addin" (and --remove-word-addin) to add Delete Page to Word.
# It's Ndalamo without the loading screen, so nothing flashes up while installing,
# and it has no shortcuts.
java-options=-Dndalamo.helper=true
win-shortcut=false
win-menu=false
win-console=false
